name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest 2>&1 | tee test.log
      - name: Build APKs
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease -PversionCode=${{ github.run_number }} 2>&1 | tee build.log
      # Signs the release APK with the key in signing/hermes-keys.p12.gpg (unlocked by the
      # SIGNING_PASSWORD secret; see signing/README.md). Without the secret, only the debug APK is published.
      - name: Sign APKs
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Hermes-debug.apk
          if [ -z "${SIGNING_PASSWORD:-}" ]; then
            echo "SIGNING_PASSWORD isn't set; publishing the debug APK only." | tee signing.log
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS="$RUNNER_TEMP/keys.p12"
          trap 'rm -f "$KS"' EXIT
          # First run with the secret: create the release key, encrypted with the secret, and commit
          # only the encrypted file. Nobody ever has to see or share the password.
          if [ ! -f signing/hermes-keys.p12.gpg ]; then
            keytool -genkeypair -storetype PKCS12 -keystore "$KS" -alias hermes -keyalg RSA -keysize 4096 \
              -validity 36500 -dname "CN=Hermes" -storepass:env SIGNING_PASSWORD -keypass:env SIGNING_PASSWORD
            gpg --quiet --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
              --passphrase-fd 0 -o signing/hermes-keys.p12.gpg "$KS" <<< "$SIGNING_PASSWORD"
            rm -f "$KS"
            if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              git add signing/hermes-keys.p12.gpg
              git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
                commit -m "Add encrypted release signing key [skip ci]"
              git push origin HEAD:main
            fi
          fi
          gpg --quiet --batch --yes --pinentry-mode loopback --decrypt --passphrase-fd 0 -o "$KS" signing/hermes-keys.p12.gpg <<< "$SIGNING_PASSWORD"
          "$BT/apksigner" sign --ks "$KS" --ks-type PKCS12 --ks-key-alias hermes \
            --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD \
            --out dist/Hermes.apk app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f dist/*.idsig
          "$BT/apksigner" verify -v --print-certs dist/Hermes.apk 2>&1 | tee signing.log
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-apk
          path: dist/*.apk
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Hermes (latest build)
          body: |
            Install **Hermes.apk** on your AYN Thor. (If only Hermes-debug.apk is here, the signing secret isn't set up yet.)

            versionCode: ${{ github.run_number }}
            commit: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: dist/*.apk
      - name: Move the "latest" tag to this commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Remove old files from the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=$(ls dist)
          for asset in $(gh release view latest --json assets -q '.assets[].name'); do
            echo "$keep" | grep -qx "$asset" || gh release delete-asset latest "$asset" -y
          done
      # Saves the result and any errors to a hidden ref (refs/ci/<branch>) readable with plain git.
      - name: Save build report
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/report && cd /tmp/report && git init -q
          printf 'status: %s\nsha: %s\nrun: %s\n' "${{ job.status }}" "${{ github.sha }}" "${{ github.run_number }}" > status.txt
          cp "$GITHUB_WORKSPACE/signing.log" . 2>/dev/null || true
          for f in test build; do
            if [ -f "$GITHUB_WORKSPACE/$f.log" ]; then
              grep -E "^e: |error:|FAILED|Exception|expected:|What went wrong" -A3 "$GITHUB_WORKSPACE/$f.log" | head -400 > "$f-errors.txt" || true
              tail -150 "$GITHUB_WORKSPACE/$f.log" > "$f-tail.txt"
            fi
          done
          grep -l "<failure" -r "$GITHUB_WORKSPACE/app/build/test-results" 2>/dev/null | head -5 | while read x; do cp "$x" .; done || true
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "build report"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/ci/${GITHUB_REF_NAME}
